<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#666A50">
<title>NUtopia Menu</title>
<style>
:root{--bg:#666A50;--ink:#F4F1E8;--chip:rgba(255,255,255,.12);--on:#F4F1E8;--onink:#4c4f3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:62px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
nav{position:sticky;top:0;z-index:5;background:rgba(84,88,64,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;font:600 15px/1 inherit;font-family:inherit;color:var(--ink);background:var(--chip);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--on);color:var(--onink)}
main{max-width:820px;margin:0 auto;padding:12px 12px 90px;display:grid;gap:12px}
figure{margin:0;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.08);box-shadow:0 4px 16px rgba(0,0,0,.18)}
figure img{display:block;width:100%;height:auto;cursor:zoom-in}
@media (orientation:landscape) and (min-width:900px){main{max-width:1400px;grid-template-columns:1fr 1fr}}
#top{position:fixed;right:16px;bottom:18px;z-index:6;width:52px;height:52px;border-radius:50%;border:0;background:var(--on);color:var(--onink);font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#top.show{opacity:1;pointer-events:auto}
#zoom{position:fixed;inset:0;z-index:9;background:rgba(20,21,15,.96);display:none;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
#zoom.show{display:block}
#zoom img{display:block;width:100%;max-width:1080px;margin:0 auto}
#zx{position:fixed;top:12px;right:12px;z-index:10;width:46px;height:46px;border-radius:50%;border:0;background:var(--on);color:var(--onink);font-size:22px;display:none}
#zoom.show+#zx{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(84,88,64,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 -2px 12px rgba(0,0,0,.2)}
#bar a{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 12px;border-radius:12px;font:600 16px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;text-decoration:none;color:var(--ink);background:var(--chip)}
#bar a.pri{background:var(--on);color:var(--onink)}
#bar a.bk{flex:0 0 auto;padding:8px 18px}
#bar a[hidden]{display:none}
main{padding-bottom:110px}
#top{bottom:96px}
</style></head><body>
<nav id="nav"><button data-i="1">Price List</button><button data-i="15">Promos</button><button data-i="18">Spa Party</button></nav>
