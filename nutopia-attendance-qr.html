<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>NUtopia — Staff Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1E8;--s1:#FDFBF7;--s2:#F1EDE2;--bd:#DCD5C2;--wh:#2F2F22;--mt:#76775F;--gold:#555A36;--gold2:#8A6D1D;--red:#B0392B;--green:#3E7A3A;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--wh);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at 50% 0%,#FFFFFF 0%,var(--bg) 65%) fixed}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 40px}
.brand{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--gold);font-size:30px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.32em;color:var(--mt);margin-top:4px;font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock{font-family:var(--serif);font-size:34px;color:var(--wh);text-align:right;line-height:1}
.clock small{display:block;font-family:var(--sans);font-size:13px;color:var(--mt);margin-top:6px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#FAF8F2;border-radius:14px;padding:14px 20px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.block{display:block;width:100%}
.btn.big{font-size:22px;padding:20px 22px;border-radius:18px}
.btn:disabled{opacity:.45}
.icon-btn{background:transparent;border:1px solid var(--bd);color:var(--mt);border-radius:12px;padding:10px 14px;font-size:14px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:22px}
.muted{color:var(--mt)}
.err{background:#FBE6E3;border:1px solid var(--red);color:#8E2A1E;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mt);margin-bottom:6px}
.field select,.field input{width:100%;height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);color:var(--wh);padding:0 14px;font:500 17px var(--sans)}
/* Display */
.disp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;margin-top:22px;align-items:start}
@media (max-width:820px){.disp{grid-template-columns:1fr}}
.qrbox{text-align:center}
.qr{background:#fff;border-radius:22px;padding:18px;display:inline-block;width:min(78vw,460px);aspect-ratio:1/1;box-shadow:0 14px 40px rgba(60,60,40,.18)}
.qr svg{width:100%;height:100%;display:block}
.qr-t{font-family:var(--serif);font-size:clamp(30px,4.4vw,44px);font-weight:600;margin:18px 0 4px}
.bar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden;width:min(78vw,460px);margin:14px auto 0}
.bar i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:left;transition:transform 1s linear}
.who h3{margin:0 0 12px;font-family:var(--serif);font-size:26px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--bd);font-size:17px}
.row:first-of-type{border-top:0}
.chip{font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mt);white-space:nowrap}
.chip.in{color:var(--green);border-color:rgba(127,176,105,.5)}
.chip.out{color:var(--gold2);border-color:rgba(138,109,29,.45)}
.offline{display:none;margin-top:10px;font-size:13px;color:var(--gold2)}
/* Phone */
.phone{max-width:460px;margin:0 auto;padding:26px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
.hello{font-family:var(--serif);font-size:40px;font-weight:600;margin:34px 0 4px;line-height:1.05}
.status{font-size:17px;color:var(--mt);margin-bottom:26px}
.big-ok{text-align:center;margin-top:40px}
.big-ok .tick{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:56px;background:rgba(62,122,58,.10);border:2px solid var(--green);color:var(--green)}
.big-ok .tick.warn{background:rgba(85,90,54,.10);border-color:var(--gold);color:var(--gold)}
.big-ok h2{font-family:var(--serif);font-size:38px;margin:0 0 6px}
.big-ok p{font-size:18px;color:var(--mt);margin:4px 0}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,30,20,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:22px}
.modal h3{margin:0 0 4px;font-family:var(--serif);font-size:28px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--bd)}
.srow b{flex:1;min-width:120px;font-size:17px}
.srow .mini{font-size:13px;padding:8px 11px;border-radius:10px}
.enroll-qr{background:#fff;border-radius:18px;padding:14px;width:min(70vw,340px);aspect-ratio:1/1;margin:14px auto;display:block}
.enroll-qr svg{width:100%;height:100%;display:block}
.center{text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* qrcode-generator 1.4.4 (MIT, Kazuhiko Arase) — naka-inline para gumana kahit offline */
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;

    const close = v => { bg.remove(); resolve(v); };
    $("#al-x").onclick = () => close("");
    api("GET", { action: "loginUsers" }).then(j => {
      const us = (j && j.users) || [];
      $("#al-u").innerHTML = `<option value="__attpin__">Admin PIN</option>` + us.map(u => `<option value="${esc(u.id)}">${esc(u.name)}</option>`).join("");
    }).catch(() => { $("#al-e").innerHTML = `<div class="err">No internet — admin login needs a connection.</div>`; });
    $("#al-ok").onclick = async () => {
      $("#al-ok").disabled = true; $("#al-e").innerHTML = "";
      try {
        const u = $("#al-u").value;
        const j = u === "__attpin__" ? await api("POST", { action: "qaAdminLogin", pin: $("#al-p").value, device: device() })
          : await api("POST", { action: "login", userId: u, pin: $("#al-p").value, device: device() });
        if (j.status === "ok" && j.user && (j.user.role === "admin" || j.user.role === "attadmin")) { adminTok = j.token; close(j.token); return; }
        $("#al-e").innerHTML = `<div class="err">${esc(j.status === "ok" ? "This user is not an Admin." : (j.msg || "Login failed."))}</div>`;
      } catch (e) { $("#al-e").innerHTML = `<div class="err">No connection. Try again.</div>`; }
      $("#al-ok").disabled = false;
    };
  });
}

// ══════════════ SCREEN NG SPA (PC / salon phone) ══════════════
let hmacKey = null, lastW = 0, todayList = null, online = true;
async function displayKey(secret) {
  return crypto.subtle.importKey("raw", new TextEncoder().encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
}
async function codeFor(w) {
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", hmacKey, new TextEncoder().encode("w:" + w)));
  return Array.from(sig).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
function renderSetup(msg) {
  app.innerHTML = `<div class="wrap"><div class="top"><div class="brand">NUtopia Spa<small>STAFF ATTENDANCE</small></div></div>
    <div class="card" style="max-width:520px;margin:40px auto 0">
      <h2 style="font-family:var(--serif);font-size:32px;margin:0 0 8px">Set up this screen</h2>
      <p class="muted" style="line-height:1.55;margin:0 0 18px">One-time setup. An Admin logs in once so this PC (or spa phone) can show the attendance QR — even when the internet is down.</p>
      <button class="btn block big" id="setup">Admin log in</button>${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    </div></div>`;
  $("#setup").onclick = async () => {
    const tok = await adminLogin("Set up this screen"); if (!tok) return;
    try {
      const j = await api("POST", { action: "qaDisplaySetup", token: tok, origin: location.origin, device: device() });
      if (j.status !== "ok") return renderSetup(j.msg || "Setup failed.");
      lsSet(LS.disp, { secret: j.secret, at: Date.now() });
      startDisplay();
    } catch (e) { renderSetup("No connection. Try again."); }
  };
}
async function startDisplay() {
  const d = lsGet(LS.disp);
  if (!d || !d.secret) return renderSetup();
  hmacKey = await displayKey(d.secret);
  app.innerHTML = `<div class="wrap">
    <div class="top"><div class="brand">NUtopia Spa<small>STAFF ATTENDANCE</small></div><div class="clock" id="clk"></div></div>
    <div class="disp">
      <div class="qrbox card">
        <div class="qr" id="qr"></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="qr-t">Scan to Time In / Out</div>
        <div class="muted" style="font-size:16px">Use your own phone's camera · Face ID / fingerprint</div>
        <div class="offline" id="off">⚠ Offline — the QR still works. Staff phones need mobile data.</div>
      </div>
      <div class="card who"><h3>Today</h3><div id="list"><div class="muted">Loading…</div></div>
        <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="icon-btn" id="adm">⚙ Admin</button></div></div>
    </div></div>`;
  $("#adm").onclick = openAdmin;
  tick(); setInterval(tick, 1000);
  loadToday(); setInterval(loadToday, 30000);
}
async function tick() {
  const now = Date.now(), w = Math.floor(now / 1000 / WIN), left = WIN - Math.floor(now / 1000) % WIN;
  const d = new Date(now);
  const clk = $("#clk"); if (clk) clk.innerHTML = esc(d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" })) + `<small>${esc(d.toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric" }))}</small>`;
  const bar = $("#bar"); if (bar) bar.style.transform = `scaleX(${left / WIN})`;
  if (w !== lastW && hmacKey) {
    lastW = w;
    const c = await codeFor(w);
    const q = $("#qr"); if (q) q.innerHTML = qrSvg(baseUrl() + "?c=" + c + "&w=" + w);
  }
}
async function loadToday() {
  try {
    const j = await api("GET", { action: "qaToday" });
    online = true; $("#off") && ($("#off").style.display = "none");
    todayList = j.staff || [];
  } catch (e) { online = false; $("#off") && ($("#off").style.display = "block"); }
  const el = $("#list"); if (!el || !todayList) return;
  const sorted = todayList.slice().sort((a, b) => (b.timeIn && !b.timeOut) - (a.timeIn && !a.timeOut) || a.name.localeCompare(b.name));
  el.innerHTML = sorted.length ? sorted.map(s => `<div class="row"><span>${esc(s.name)}</span>${s.timeIn && !s.timeOut ? `<span class="chip in">● In ${esc(to12(s.timeIn))}</span>` : s.timeOut ? `<span class="chip out">${esc(to12(s.timeIn))} – ${esc(to12(s.timeOut))}</span>` : `<span class="chip">—</span>`}</div>`).join("") : `<div class="muted">No staff yet.</div>`;
}
async function openAdmin() {
  if (!adminTok) { const t = await adminLogin("Admin"); if (!t) return; }
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Staff phones</h3><button class="icon-btn" id="ax">✕ Close</button></div>
    <p class="muted" style="margin:4px 0 10px">Register = one time per staff. Reset = lost / new phone. Manual = phone forgotten or dead battery (logged).</p>
    <div id="alist"><div class="spin"></div></div></div>`;
  document.body.appendChild(bg);
  $("#ax").onclick = () => { bg.remove(); loadToday(); };
  const load = async () => {
    try {
      const j = await api("POST", { action: "qaAdminList", token: adminTok });
      if (j.status === "forbidden") { adminTok = ""; bg.remove(); return openAdmin(); }
      $("#alist").innerHTML = (j.staff || []).map(s => `<div class="srow"><b>${esc(s.name)}<br><small class="muted" style="font-weight:400;font-size:12px">${s.registered ? "📱 " + esc(s.device) : "Not registered"}</small></b>
        <button class="btn mini" data-reg="${esc(s.id)}" data-n="${esc(s.name)}">${s.registered ? "Re-register" : "Register phone"}</button>
        ${s.registered ? `<button class="btn ghost mini" data-reset="${esc(s.id)}" data-n="${esc(s.name)}">Reset</button>` : ""}
        <button class="btn ghost mini" data-man="in" data-id="${esc(s.id)}" data-n="${esc(s.name)}">Manual In</button>
        <button class="btn ghost mini" data-man="out" data-id="${esc(s.id)}" data-n="${esc(s.name)}">Manual Out</button></div>`).join("") || `<div class="muted">No active staff in the Staff tab.</div>`;
    } catch (e) { $("#alist").innerHTML = `<div class="err">No connection.</div>`; }
  };
  bg.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.reg) {
      b.disabled = true;
      const j = await api("POST", { action: "qaEnrollStart", token: adminTok, staffId: b.dataset.reg }).catch(() => null);
      b.disabled = false;
      if (!j || j.status !== "ok") return alert((j && j.msg) || "No connection.");
      $("#alist").innerHTML = `<div class="center"><h3 style="margin-top:6px">Register ${esc(b.dataset.n)}'s phone</h3>
        <p class="muted" style="margin:0">Let <b>${esc(b.dataset.n)}</b> scan this with <b>their own phone</b>, then follow the steps. Valid for 10 minutes.</p>
        <div class="enroll-qr">${qrSvg(baseUrl() + "?enroll=" + j.e)}</div>
        <button class="btn ghost" id="aback">← Back to list</button></div>`;
      $("#aback").onclick = load;
    } else if (b.dataset.reset) {
      if (!confirm("Reset " + b.dataset.n + "'s phone? They will need to register again.")) return;
      const j = await api("POST", { action: "qaReset", token: adminTok, staffId: b.dataset.reset }).catch(() => null);
      if (!j || j.status !== "ok") return alert((j && j.msg) || "No connection.");
      load();
    } else if (b.dataset.man) {
      const why = prompt("Manual Time " + (b.dataset.man === "in" ? "In" : "Out") + " for " + b.dataset.n + " now.\nReason (e.g. forgot phone):", "");
      if (why === null) return;
      const j = await api("POST", { action: "qaManual", token: adminTok, staffId: b.dataset.id, kind: b.dataset.man, reason: why }).catch(() => null);
      if (!j || j.status !== "ok") return alert((j && j.msg) || "No connection.");
      alert(b.dataset.n + " — Time " + (j.kind === "out" ? "Out" : "In") + " " + to12(j.time));
      loadToday();
    }
  });
  load();
}

// ══════════════ PHONE NG STAFF ══════════════
function phoneShell(inner) { app.innerHTML = `<div class="phone"><div class="brand" style="font-size:24px">NUtopia Spa<small>STAFF ATTENDANCE</small></div>${inner}</div>`; }
function phoneMsg(icon, title, lines, warn) {
  phoneShell(`<div class="big-ok"><div class="tick${warn ? " warn" : ""}">${icon}</div><h2>${esc(title)}</h2>${(lines || []).map(l => `<p>${l}</p>`).join("")}</div>`);
}
const hasPasskey = () => !!(window.PublicKeyCredential && navigator.credentials);

async function startEnroll(e) {
  phoneShell(`<div class="spin"></div>`);
  if (!hasPasskey()) return phoneMsg("!", "Not supported", ["This browser can't use Face ID / fingerprint.", "Open this in <b>Safari</b> (iPhone) or <b>Chrome</b> (Android)."], true);
  let info;
  try { info = await api("GET", { action: "qaEnrollInfo", e }); } catch (er) { return phoneMsg("!", "No internet", ["Connect to WiFi or mobile data, then scan again."], true); }
  if (info.status !== "ok") return phoneMsg("!", "QR expired", [esc(info.msg || "Ask the admin for a new QR.")], true);
  const old = lsGet(LS.cred);
  phoneShell(`<div class="hello">Hi, ${esc(info.staffName)} 👋</div>
    <div class="status">Register <b>this phone</b> for your attendance. You only do this once.</div>
    ${old && old.staffId !== info.staffId ? `<div class="err" style="margin:0 0 16px">This phone is currently registered to <b>${esc(old.name)}</b>. Continuing will switch it to ${esc(info.staffName)}.</div>` : ""}
    <ol class="muted" style="line-height:1.7;padding-left:20px;margin:0 0 24px;font-size:16px"><li>Tap <b>Register this phone</b></li><li>Confirm with <b>Face ID</b> or <b>fingerprint</b></li><li>Done — from now on just scan the QR at the spa</li></ol>
    <button class="btn block big" id="go">Register this phone</button><div id="er"></div>`);
  $("#go").onclick = async () => {
    $("#go").disabled = true; $("#er").innerHTML = "";
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: unb64u(info.challenge),
        rp: { name: "NUtopia Attendance", id: location.hostname },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: info.staffName + " · NUtopia", displayName: info.staffName + " (NUtopia Attendance)" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
        attestation: "none", timeout: 120000 } });
      const pub = extractPoint(cred.response);
      if (!pub) throw new Error("key");
      const j = await api("POST", { action: "qaEnrollFinish", e, credId: cred.id, pub: b64u(pub), clientDataJSON: b64u(cred.response.clientDataJSON), device: device() });
      if (j.status !== "ok") throw new Error(j.msg || "Setup failed");
      lsSet(LS.cred, { credId: cred.id, staffId: String(j.staffId), name: j.staffName, at: Date.now() });
      phoneMsg("✓", "Phone registered!", [`<b>${esc(j.staffName)}</b>, you're all set.`, "Every day: scan the QR at the spa → Time In / Out → Face ID / fingerprint."]);
    } catch (er) {
      $("#go").disabled = false;
      $("#er").innerHTML = `<div class="err">${esc(er && er.name === "NotAllowedError" ? "Cancelled or Face ID / fingerprint not confirmed. Try again." : er && er.message === "key" ? "This phone's security key type isn't supported." : (er && er.message) || "Setup failed. Try again.")}</div>`;
    }
  };
}
// Public key (0x04||X||Y) mula sa bagong passkey
function extractPoint(resp) {
  try { if (resp.getPublicKey) { const spki = new Uint8Array(resp.getPublicKey()); if (spki.length >= 65) { const p = spki.slice(spki.length - 65); if (p[0] === 4) return p; } } } catch (e) {}
  try { // fallback: basahin ang attestationObject (CBOR)
    const att = cbor(new Uint8Array(resp.attestationObject)), ad = att.authData;
    const credLen = (ad[53] << 8) | ad[54], cose = cbor(ad.slice(55 + credLen));
    const x = cose[-2], y = cose[-3]; if (!x || !y) return null;
    const p = new Uint8Array(65); p[0] = 4; p.set(x, 1); p.set(y, 33); return p;
  } catch (e) { return null; }
}
function cbor(buf) { // maliit na CBOR reader (sapat para sa WebAuthn)
  let i = 0;
  const len = ai => { if (ai < 24) return ai; if (ai === 24) return buf[i++]; if (ai === 25) { const v = (buf[i] << 8) | buf[i + 1]; i += 2; return v; } if (ai === 26) { const v = ((buf[i] << 24) >>> 0) + (buf[i + 1] << 16) + (buf[i + 2] << 8) + buf[i + 3]; i += 4; return v; } throw new Error("cbor"); };
  const rd = () => { const b = buf[i++], mt = b >> 5, ai = b & 31;
    if (mt === 0) return len(ai); if (mt === 1) return -1 - len(ai);
    if (mt === 2) { const n = len(ai), v = buf.slice(i, i + n); i += n; return v; }
    if (mt === 3) { const n = len(ai), v = new TextDecoder().decode(buf.slice(i, i + n)); i += n; return v; }
    if (mt === 4) { const n = len(ai), a = []; for (let k = 0; k < n; k++) a.push(rd()); return a; }
    if (mt === 5) { const n = len(ai), o = {}; for (let k = 0; k < n; k++) { const kk = rd(); o[kk] = rd(); } return o; }
    if (mt === 7) return ai === 20 ? false : ai === 21 ? true : null;
    throw new Error("cbor"); };
  return rd();
}

async function startClock(c, w) {
  const me = lsGet(LS.cred);
  if (!hasPasskey()) return phoneMsg("!", "Not supported", ["Open this in <b>Safari</b> (iPhone) or <b>Chrome</b> (Android)."], true);
  phoneShell(`<div class="spin"></div>`);
  let ch;
  try { ch = await api("GET", me && me.credId ? { action: "qaChallenge", cred: me.credId } : { action: "qaChallenge" }); }
  catch (e) { return phoneMsg("!", "No internet", ["Turn on WiFi or mobile data, then scan the QR again."], true); }
  if (ch.status === "unregistered") { return phoneMsg("!", "Phone not registered", [esc(ch.msg)], true); }
  if (ch.status !== "ok") return phoneMsg("!", "Try again", [esc(ch.msg || "Scan the QR again.")], true);
  if (ch.generic) { // walang naka-save sa phone na ito — passkey (Face ID) ang magsasabi kung sino
    phoneShell(`<div class="hello">Hi 👋</div><div class="status">Tap below and confirm with Face ID / fingerprint.</div>
      <button class="btn block big" id="go">Time In / Out</button><div id="er"></div>
      <p class="muted center" style="margin-top:auto;padding-top:30px;font-size:13px">Never registered this phone? Ask the admin to <b>register your phone</b> first (one time only).</p>`);
    $("#go").onclick = () => doClock(null, ch, c, w);
    return;
  }
  const done = ch.timeIn && ch.timeOut, isOut = ch.timeIn && !ch.timeOut;
  if (done) return phoneMsg("✓", "All done today", [`<b>${esc(ch.staffName)}</b>`, `In ${esc(to12(ch.timeIn))} · Out ${esc(to12(ch.timeOut))}`, "Need a change? Ask the admin."]);
  phoneShell(`<div class="hello">Hi, ${esc(ch.staffName)} 👋</div>
    <div class="status">${isOut ? `You timed in at <b>${esc(to12(ch.timeIn))}</b>.` : "You haven't timed in today."}</div>
    <button class="btn block big" id="go">${isOut ? "Time Out" : "Time In"}</button>
    <p class="muted center" style="margin-top:14px;font-size:14px">You'll be asked for Face ID / fingerprint.</p><div id="er"></div>
    <p class="muted center" style="margin-top:auto;padding-top:30px;font-size:12px">Not ${esc(ch.staffName)}? This phone is registered to them — ask the admin.</p>`);
  $("#go").onclick = () => doClock(me, ch, c, w);
}
async function doClock(me, ch, c, w) {
    $("#go").disabled = true; $("#er").innerHTML = "";
    try {
      const pk = { challenge: unb64u(ch.challenge), rpId: location.hostname, userVerification: "required", timeout: 90000 };
      if (me) pk.allowCredentials = [{ type: "public-key", id: unb64u(me.credId) }];
      const a = await navigator.credentials.get({ publicKey: pk });
      const j = await api("POST", { action: "qaClock", credId: a.id, c, w,
        clientDataJSON: b64u(a.response.clientDataJSON), authenticatorData: b64u(a.response.authenticatorData), signature: b64u(a.response.signature) });
      if (j.status === "ok" || j.status === "done") lsSet(LS.cred, { credId: a.id, staffId: String(j.staffId || ""), name: j.staffName || "", at: Date.now() });
      if (j.status === "unregistered") throw new Error(j.msg);
      if (j.status === "ok") {
        const out = j.kind === "out";
        return phoneMsg("✓", (out ? "Time Out " : "Time In ") + to12(j.time), [`<b>${esc(j.staffName)}</b>`, out ? `Today: ${esc(to12(j.timeIn))} – ${esc(to12(j.timeOut))}` : "Have a great day! ✨"]);
      }
      if (j.status === "done") return phoneMsg("✓", "All done today", [`In ${esc(to12(j.timeIn))} · Out ${esc(to12(j.timeOut))}`]);
      throw new Error(j.msg || "Failed");
    } catch (er) {
      $("#go").disabled = false;
      $("#er").innerHTML = `<div class="err">${esc(er && er.name === "NotAllowedError" ? (me ? "Face ID / fingerprint not confirmed. Try again." : "Couldn't confirm. If this phone was never registered, ask the admin to register it.") : (er && er.message) || "Failed. Scan the QR again.")}</div>`;
    }
}

// ── Simula ──
if (qp.get("enroll")) startEnroll(qp.get("enroll"));
else if (qp.get("c") && qp.get("w")) startClock(qp.get("c"), qp.get("w"));
else startDisplay();
</script>
